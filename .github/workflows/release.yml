# Packages the addon and uploads it to CurseForge.
#
# How to release: bump "## Version:" in SAOFrames.toc (and add a CHANGELOG.md entry), then push to
# main. If tag v<version> doesn't exist yet, this job creates it and publishes that version.
# Pushing a version tag yourself (git tag v1.7.0 && git push --tags) or running the workflow by hand
# (Actions > Release > Run workflow) also works.
# Tags/versions containing "alpha" or "beta" upload as that release type.
#
# One-time setup: repo secret CF_API_KEY (authors.curseforge.com > settings > API Tokens);
# the CurseForge project ID is in SAOFrames.toc as "## X-Curse-Project-ID".
name: Release

on:
  push:
    branches: [main]
    paths: ['SAOFrames.toc', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the TOC version if it isn't released yet
        id: version
        run: |
          VERSION=$(grep -m1 '^## Version:' SAOFrames.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Triggered by tag ${GITHUB_REF_NAME}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "SAO Frames $TAG"
            git push origin "$TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Run the BigWigs packager directly. A tag pushed by this job with GITHUB_TOKEN doesn't start
      # a new workflow run, and the packager skips branch builds whose commit is tagged ("future
      # tag"), so tell it this is that tag's build.
      - name: Package and upload to CurseForge
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o /tmp/release.sh
          GITHUB_REF="refs/tags/${TAG}" GITHUB_REF_NAME="${TAG}" GITHUB_REF_TYPE=tag bash /tmp/release.sh
